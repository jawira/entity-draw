name: Quality Assurance
on: [ pull_request ]
jobs:
  QA:
    strategy:
      matrix:
        php: [ '8.2','8.3','8.4','8.5' ]
        lowest: [ '0', '1' ]

    runs-on: ubuntu-latest
    steps:

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          # Using phar tools allows to avoid errors while installing lowest/latest dependencies
          tools: phing:3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Composer dependencies
        env:
          COMPOSER_PREFER_LOWEST: ${{ matrix.lowest }}
        run: composer update

      - name: Install Composer dependencies and validate
        run: >
          phing -longtargets -logger \\Phing\\Listener\\AnsiColorLogger
          composer:install composer:validate

      - name: Psalm
        run: >
          phing -longtargets -logger \\Phing\\Listener\\AnsiColorLogger
          psalm:check

      - name: php-cs-fixer
        run: >
          phing -longtargets -logger \\Phing\\Listener\\AnsiColorLogger
          cs:check

      - name: phpunit
        run: >
          phing -longtargets -logger \\Phing\\Listener\\AnsiColorLogger
          phpunit:check
